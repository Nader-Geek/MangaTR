[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mangatr"
version = "0.0.0"
description = "Manga and comic translation, Arabic and English targets"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["mangatr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: needs a GPU and downloaded models; skipped by default"]
addopts = "-m 'not gpu'"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
