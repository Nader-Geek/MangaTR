[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mangatr"
version = "0.0.0"
description = "Manga and comic translation, Arabic and English targets"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "opencv-python-headless>=4.9", "pillow>=10.1", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "onnx>=1.16", "onnxruntime>=1.18"]
# on a GPU machine install this instead of onnxruntime: the two conflict
gpu = ["onnxruntime-gpu>=1.18", "huggingface_hub>=0.23"]
# manga-ocr (Japanese reading): torch, transformers; its tokenizer needs fugashi + a dictionary
ocr = ["torch", "transformers>=4.40", "fugashi", "unidic-lite"]
bot = ["discord.py>=2.4"]

[tool.hatch.build.targets.wheel]
packages = ["mangatr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: needs a GPU and downloaded models; skipped by default"]
addopts = "-m 'not gpu'"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
